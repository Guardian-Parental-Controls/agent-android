name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Guardian-Parental-Controls/agent-common
          ref: v1.0.0
          path: _agent-common
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate UniFFI Kotlin bindings
        working-directory: _agent-common
        run: |
          set -euo pipefail
          cargo build
          cargo run --bin uniffi-bindgen -- \
            generate --language kotlin --library --no-format \
            --out-dir ../app/src/main/java \
            target/debug/libguardian_agent.so
      - name: Unit tests
        run: ./gradlew test --no-daemon
