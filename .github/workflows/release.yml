name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (for example v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          TAG="${TAG#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: actions/checkout@v5
        with:
          repository: Guardian-Parental-Controls/agent-common
          ref: ${{ needs.resolve.outputs.tag }}
          path: _agent-common

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable

      - name: Generate UniFFI Kotlin bindings
        working-directory: _agent-common
        run: |
          set -euo pipefail
          cargo build
          cargo run --bin uniffi-bindgen -- \
            generate --language kotlin --library --no-format \
            --out-dir ../app/src/main/java \
            target/debug/libguardian_agent.so

      - name: Configure Firebase
        run: |
          if [[ -n "${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}" ]]; then
            printf '%s' "${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}" > app/google-services.json
          fi
          [[ -f app/google-services.json ]] || cp app/google-services.json.example app/google-services.json

      - name: Configure release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_B64" ]]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > release.keystore
            echo "ANDROID_KEYSTORE_PATH=${{ github.workspace }}/release.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - uses: android-actions/setup-android@v3

      - name: Package release APK
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GUARDIAN_AGENT_VERSION: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          TAG="${{ needs.resolve.outputs.tag }}"
          mkdir -p dist
          APK_NAME="guardian-android-agent-${TAG}.apk"
          cp "$APK_SRC" "dist/${APK_NAME}"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n1)"
          DIGEST="$("$APKSIGNER" verify --print-certs "dist/${APK_NAME}" 2>/dev/null | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)"
          python3 - "$DIGEST" > "dist/guardian-android-agent-${TAG}.signature-checksum" <<'PY'
          import sys
          hex_digest = sys.argv[1].lower().replace(":", "").strip()
          raw = bytes.fromhex(hex_digest)
          alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_"
          out = []
          i = 0
          while i < len(raw):
              b0 = raw[i]
              i += 1
              if i < len(raw):
                  b1 = raw[i]
                  i += 1
                  if i < len(raw):
                      b2 = raw[i]
                      i += 1
                      out.append(alphabet[b0 >> 2])
                      out.append(alphabet[((b0 & 3) << 4) | (b1 >> 4)])
                      out.append(alphabet[((b1 & 15) << 2) | (b2 >> 6)])
                      out.append(alphabet[b2 & 63])
                  else:
                      out.append(alphabet[b0 >> 2])
                      out.append(alphabet[((b0 & 3) << 4) | (b1 >> 4)])
                      out.append(alphabet[(b1 & 15) << 2])
              else:
                  out.append(alphabet[b0 >> 2])
                  out.append(alphabet[(b0 & 3) << 4])
          print("".join(out))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/guardian-android-agent-*

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts

      - name: Recreate empty immutable release (backfill)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.resolve.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            exit 0
          fi
          ASSETS="$(gh release view "$TAG" --json assets -q '.assets|length')"
          IMMUTABLE="$(gh release view "$TAG" --json isImmutable -q .isImmutable)"
          if [[ "$ASSETS" == "0" && "$IMMUTABLE" == "true" ]]; then
            echo "Removing empty immutable release ${TAG} so binaries can be attached"
            gh release delete "$TAG" --yes
          fi

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: ${{ needs.resolve.outputs.tag }}
          generate_release_notes: true
          files: artifacts/*

      - name: Create automation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GUARDIAN_VERSIONS_APP_ID }}
          private-key: ${{ secrets.GUARDIAN_VERSIONS_PRIVATE_KEY }}
          owner: Guardian-Parental-Controls
          repositories: versions

      - name: Publish versions feed component
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import base64
          import json
          import os
          import subprocess
          from pathlib import Path

          tag = os.environ["TAG"]
          version = os.environ["VERSION"]
          owner_repo = os.environ["REPO"]
          base = f"https://github.com/{owner_repo}/releases/download/{tag}"
          apk = f"guardian-android-agent-{tag}.apk"

          checkout = subprocess.run(
              [
                  "gh",
                  "api",
                  "repos/Guardian-Parental-Controls/versions/contents/components/agent-android.json",
                  "--jq",
                  ".content",
              ],
              check=True,
              capture_output=True,
              text=True,
          )
          current = json.loads(base64.b64decode(checkout.stdout).decode("utf-8"))
          payload = {
              **current,
              "component": "agent-android",
              "version": version,
              "repository": f"https://github.com/{owner_repo}",
              "artifacts": [
                  {
                      "id": "android-apk",
                      "url": f"{base}/{apk}",
                  }
              ],
          }
          body = {"event_type": "component-release", "client_payload": payload}
          Path("dispatch.json").write_text(json.dumps(body), encoding="utf-8")
          PY
          gh api --method POST repos/Guardian-Parental-Controls/versions/dispatches --input dispatch.json
